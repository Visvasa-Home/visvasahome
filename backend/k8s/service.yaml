apiVersion: v1
kind: Service
metadata:
  name: visvasahome-backend
  namespace: staging
  labels:
    app: visvasahome-backend
spec:
  type: ClusterIP
  selector:
    app: visvasahome-backend
  ports:
    - name: http
      port: 80
      targetPort: 8000
    - name: metrics
      port: 4000
      targetPort: 4000
